<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../indexed/login-style.css">
    <link rel="icon" type="image/png" href="../images/Untitled_design-removebg-preview.png">
</head>
<body>
    <a href="index.html" class="home-btn" title="Home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
    </a>
    <div class="login-container">
        <h1 class="login-title">SIGN UP</h1>
        <div class="divider"></div>
        
        <form class="login-form" id="signupForm">
            <div class="input-group">
                <input type="text" id="firstName" placeholder="First Name" required>
            </div>

            <div class="input-group">
                <input type="text" id="lastName" placeholder="Last Name" required>
            </div>
            
            <div class="input-group">
                <input type="email" id="signupEmail" placeholder="Email" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="signupPassword" placeholder="Password" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>
            
            <div class="input-group">
                <input type="tel" id="signupPhone" placeholder="Phone Number" required>
            </div>
            
            <div class="input-group">
                <input type="text" id="signupAddress" placeholder="Address" required>
            </div>
            
            <div class="button-container">
                <button type="submit" class="form-btn">CREATE ACCOUNT</button>
                <button type="button" class="form-btn" onclick="location.replace('login.html')">BACK TO LOGIN</button>
            </div>
         
        </form>
    </div>

    <script src="login-script.js"></script>
        <link rel="stylesheet" href="/pefumeppp/assets/cart-widget.css">
        <script src="/pefumeppp/assets/cart-widget.js" defer></script>
</body>
</html>
