<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Create Your Perfume</title>
    <link rel="stylesheet" href="create-styles.css">
</head>
<body>
    <div class="container">
        <h1 class="main-title">CRAFT YOUR PERFUME</h1>
    <div class="stars"></div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for scents..." class="search-input">
            <button class="search-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
            </button>
        </div>

        <div class="craft-panel">
            <!-- Section 1: Choose Scents -->
            <div class="section scents-section">
                <h2 class="section-title">1. CHOOSE UP TO 9 SCENTS<br><span>(MIX & MATCH)</span></h2>
                
                <div class="scents-grid">
                    <div class="scent-card" data-scent="jasmine">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #1a2a4a 0%, #0a1a3a 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#1a2a4a" stroke="#4a6a9a" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#2a4a7a" stroke="#4a6a9a" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="lavender">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #4a6a9a 0%, #2a4a7a 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#4a6a9a" stroke="#6a8aba" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#5a7aaa" stroke="#6a8aba" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="amber">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #c9a961 0%, #b89551 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#c9a961" stroke="#d9b971" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#d9b971" stroke="#e9c981" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="sandalwood">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #d4a574 0%, #c49564 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#d4a574" stroke="#e4b584" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#e4b584" stroke="#f4c594" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="ocean">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #5a8aaa 0%, #4a7a9a 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#5a8aaa" stroke="#6a9aba" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#6a9aba" stroke="#7aaaca" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="rose">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #d4a4b4 0%, #c494a4 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#d4a4b4" stroke="#e4b4c4" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#e4b4c4" stroke="#f4c4d4" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="cherry">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #c4547a 0%, #b4446a 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#c4547a" stroke="#d4648a" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#d4648a" stroke="#e4749a" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="aqua">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #6aaaaa 0%, #5a9a9a 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#6aaaaa" stroke="#7ababa" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#7ababa" stroke="#8acaca" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="violet">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #8a6a9a 0%, #7a5a8a 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#8a6a9a" stroke="#9a7aaa" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#9a7aaa" stroke="#aa8aba" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="musk">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #4a4a4a 0%, #3a3a3a 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#4a4a4a" stroke="#5a5a5a" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#5a5a5a" stroke="#6a6a6a" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="oud">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #6a5a4a 0%, #5a4a3a 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#6a5a4a" stroke="#7a6a5a" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#7a6a5a" stroke="#8a7a6a" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="vanilla">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #e4d4c4 0%, #d4c4b4 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#e4d4c4" stroke="#f4e4d4" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#f4e4d4" stroke="#fff4e4" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="blue">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #4a6a8a 0%, #3a5a7a 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#4a6a8a" stroke="#5a7a9a" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#5a7a9a" stroke="#6a8aaa" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>

                    <div class="scent-card" data-scent="gold">
                        <div class="scent-icon" style="background: linear-gradient(135deg, #d4af37 0%, #c49f27 100%);">
                            <svg width="30" height="50" viewBox="0 0 30 50" fill="none">
                                <rect x="10" y="10" width="10" height="35" rx="2" fill="#d4af37" stroke="#e4bf47" stroke-width="1"/>
                                <ellipse cx="15" cy="8" rx="6" ry="4" fill="#e4bf47" stroke="#f4cf57" stroke-width="1"/>
                            </svg>
                        </div>
                        <input type="checkbox" class="scent-check">
                    </div>
                </div>
            </div>

            <!-- Section 2: Set Grams -->
            <div class="section grams-section">
                <h2 class="section-title">2. SET GRAMS PER SCENT</h2>
                
                <div class="sliders-container">
                    <div class="slider-item">
                        <label>Jasmine</label>
                        <input type="range" min="0" max="20" value="0" class="scent-slider">
                        <span class="slider-value">0</span>
                    </div>

                    <div class="slider-item">
                        <label>Oud</label>
                        <input type="range" min="0" max="20" value="20" class="scent-slider">
                        <span class="slider-value">20</span>
                    </div>

                   

                    <div class="slider-item">
                        <label>Mask</label>
                        <input type="range" min="0" max="20" value="0" class="scent-slider">
                        <span class="slider-value">0</span>
                    </div>
                </div>

                <div class="total-grams">
                    TOTAL MIX: <span id="totalGrams">50</span> grams
                </div>
            </div>

            <!-- Section 3: Select Bottle -->
            <div class="section bottle-section">
                <h2 class="section-title">3. SELECT YOUR BOTTLE</h2>
                
                <div class="bottles-container">
                    <div class="bottle-option">
                        <div class="bottle-circle">
                            <svg width="60" height="80" viewBox="0 0 60 80" fill="none">
                                <rect x="20" y="20" width="20" height="50" rx="3" fill="#d4af37" stroke="#e4bf47" stroke-width="2"/>
                                <rect x="24" y="15" width="12" height="8" rx="1" fill="#c49f27" stroke="#d4af37" stroke-width="1"/>
                                <ellipse cx="30" cy="13" rx="8" ry="4" fill="#e4bf47" stroke="#f4cf57" stroke-width="1"/>
                            </svg>
                        </div>
                    </div>

                    <div class="bottle-option">
                        <div class="bottle-circle">
                            <svg width="60" height="80" viewBox="0 0 60 80" fill="none">
                                <rect x="20" y="20" width="20" height="50" rx="3" fill="#c45a7a" stroke="#d46a8a" stroke-width="2"/>
                                <rect x="24" y="15" width="12" height="8" rx="1" fill="#b44a6a" stroke="#c45a7a" stroke-width="1"/>
                                <ellipse cx="30" cy="13" rx="8" ry="4" fill="#d46a8a" stroke="#e47a9a" stroke-width="1"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="price-tag">PRICE: 125 AED</div>
            <button class="add-cart-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"/>
                    <circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
                </svg>
                ADD TO CART - CUSTOM PERFUME
            </button>
        </div>

        
    </div>

    <script src="create-script.js"></script>
</body>
</html>
