<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Create Your Perfume</title>
    <link rel="stylesheet" href="create-styles.css">
    <link rel="icon" type="image/png" href="../images/Untitled_design-removebg-preview.png">
</head>
<body>
    <div class="container">
        <a href="../indexed/index.html" class="home-btn" title="Home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </a>
        <h1 class="main-title">CRAFT YOUR PERFUME</h1>

        <div class="craft-panel">
            <!-- Section 1: Choose Products (Max 3) -->
            <div class="section products-section">
                <h2 class="section-title">1. CHOOSE UP TO 3 PRODUCTS<br><span>(MIX & MATCH)</span></h2>
                
                <div class="main-layout">
                    <!-- Left Side: Products List with Search -->
                    <div class="products-column">
                        <div class="search-box">
                            <input type="text" id="searchInput" class="search-input" placeholder="Search products...">
                        </div>
                        
                        <div class="filters-row">
                            <select id="genderFilter" class="filter-select">
                                <option value="">All Genders</option>
                                <option value="1">Man</option>
                                <option value="2">Woman</option>
                                <option value="3">Unisex</option>
                            </select>
                            
                            <select id="brandFilter" class="filter-select">
                                <option value="">All Brands</option>
                                <option value="1">Dior</option>
                                <option value="2">Chanel</option>
                                <option value="3">Tom Ford</option>
                                <option value="4">Versace</option>
                                <option value="5">Gucci</option>
                                <option value="6">Prada</option>
                                <option value="7">Armani</option>
                            </select>
                        </div>
                        
                        <!-- Products Grid - Shows first 15, rest searchable -->
                        <div class="products-box" id="productsGrid">
                            <!-- Products will be loaded here -->
                        </div>
                    </div>
                    
                    <!-- Right Side: Selected Products with ML Inputs -->
                    <div class="selected-column">
                        <h3 class="selected-title">Selected Products (Max 3)</h3>
                        <div id="selectedProductsContainer" class="selected-products-list">
                            <div class="empty-state">No products selected yet</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Section 2: Select Bottle -->
            <div class="section bottle-section">
                <h2 class="section-title">3. SELECT YOUR BOTTLE</h2>
                
                <div class="bottles-container">
                    <div class="bottle-option" data-bottle-id="3" data-size="100" data-price="6" tabindex="0" role="button" aria-label="100ml Bottle - $6">
                        <div class="bottle-circle">
                            <img src="../images/photo_٢٠٢٥-١١-٢٤_١٥-٠٨-٤١ (3).jpg" alt="100ml Bottle" class="bottle-img" style="width:60px; height:80px; object-fit:cover;">
                        </div>
                        <p class="bottle-label">100ml - $6</p>
                    </div>

                    <div class="bottle-option" data-bottle-id="1" data-size="50" data-price="4" tabindex="0" role="button" aria-label="50ml Bottle - $4">
                        <div class="bottle-circle">
                            <img src="../images/photo_٢٠٢٥-١١-٢٤_١٥-٠٨-٤١.jpg" alt="50ml Bottle" class="bottle-img" style="width:60px; height:80px; object-fit:cover;">
                        </div>
                        <p class="bottle-label">50ml - $4</p>
                    </div>

                    <div class="bottle-option" data-bottle-id="2" data-size="30" data-price="3" tabindex="0" role="button" aria-label="30ml Bottle - $3">
                        <div class="bottle-circle">
                            <img src="../images/photo_٢٠٢٥-١١-٢٤_١٥-٠٨-٤١ (2).jpg" alt="30ml Bottle" class="bottle-img" style="width:60px; height:80px; object-fit:cover;">
                        </div>
                        <p class="bottle-label">30ml - $3</p>
                    </div>
                </div>
            </div>

            <!-- Section 4: Price Summary -->
            <div class="section price-section">
                <h2 class="section-title">4. PRICE SUMMARY</h2>
                <div class="price-details">
                    <div class="price-row">
                        <span>Products Cost:</span>
                        <span id="productsCost">$0.00</span>
                    </div>
                    <div class="price-row">
                        <span>Bottle Cost:</span>
                        <span id="bottleCost">$0.00</span>
                    </div>
                    <div class="price-row">
                        <span>Total ML:</span>
                        <span id="totalML">0ml</span>
                    </div>
                    <div class="price-row total-row">
                        <span>TOTAL:</span>
                        <span id="totalPrice">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Section 5: Add to Cart -->
            <div class="section action-section">
                <button class="add-cart-btn" id="addToCartBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"/>
                        <circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
                    </svg>
                    ADD TO CART - CUSTOM MIX
                </button>
            </div>
        </div>

        
    </div>

    <script src="create-script.js"></script>
    <link rel="stylesheet" href="../assets/cart-widget.css">
    <script src="../assets/cart-widget.js" defer></script>
</body>
</html>
