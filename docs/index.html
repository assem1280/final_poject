    <script>
      // Check if user is logged in and display their name
      async function checkLoginStatus() {
        try {
          const res = await fetch('/pefumeppp/perfdb/get_cart.php', { credentials: 'same-origin' });
          const data = await res.json();
          
          if (data.user_logged_in) {
            const firstName = data.first_name || 'Account';
            document.getElementById('login-link').style.display = 'none';
            document.getElementById('user-name').style.display = 'block';
            document.getElementById('user-name').textContent = firstName;
            document.getElementById('user-name').style.cursor = 'pointer';
            
            // Make the name clickable to go to dashboard
            document.getElementById('user-name').onclick = function() {
              window.location.href = '/pefumeppp/customer/dashboard.php';
            };
          } else {
            document.getElementById('login-link').style.display = 'block';
            document.getElementById('user-name').style.display = 'none';
          }
        } catch (err) {
          console.error('Error checking login status:', err);
        }
      }
      
      // Check on page load
      document.addEventListener('DOMContentLoaded', checkLoginStatus);
      
      // Also check periodically in case user logs in from another tab
      setInterval(checkLoginStatus, 30000);

      // Search functionality
      const searchInput = document.getElementById('perfume-search');
      const searchResults = document.getElementById('search-results');

      let searchTimeout;
      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        const query = this.value.trim();
        
        if (query.length < 2) {
          searchResults.classList.remove('active');
          searchResults.innerHTML = '';
          return;
        }

        searchTimeout = setTimeout(async () => {
          try {
            const res = await fetch('/pefumeppp/perfdb/search_perfumes.php?q=' + encodeURIComponent(query));
            const data = await res.json();
            
            if (data.success && data.perfumes.length > 0) {
              searchResults.innerHTML = data.perfumes.map(p => `
                <div class="search-item" onclick="window.location.href='/pefumeppp/perfdb/product-details.php?id=${p.id}'">
                  <img src="${p.image || '../images/default-perfume.png'}" alt="${p.name}">
                  <div class="item-info">
                    <div class="item-name">${p.name}</div>
                    <div class="item-price">$${p.price}</div>
                  </div>
                </div>
              `).join('');
              searchResults.classList.add('active');
            } else if (data.suggestion) {
              // Show "Did you mean?" suggestion
              const s = data.suggestion;
              searchResults.innerHTML = `
                <div class="did-you-mean">
                  <span class="dym-label">Did you mean:</span>
                  <div class="search-item suggestion-item" onclick="window.location.href='/pefumeppp/perfdb/product-details.php?id=${s.id}'">
                    <img src="${s.image || '../images/default-perfume.png'}" alt="${s.name}">
                    <div class="item-info">
                      <div class="item-name">${s.name}</div>
                      <div class="item-price">$${s.price}</div>
                    </div>
                  </div>
                </div>
              `;
              searchResults.classList.add('active');
            } else {
              searchResults.innerHTML = '<div class="no-results">No perfumes found</div>';
              searchResults.classList.add('active');
            }
          } catch (err) {
            console.error('Search error:', err);
          }
        }, 300);
      });

      // Hide search results when clicking outside
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-container')) {
          searchResults.classList.remove('active');
          // Also collapse search box when clicking outside
          const searchBox = document.getElementById('search-box');
          if (searchBox && !e.target.closest('.search-box')) {
            searchBox.classList.remove('expanded');
          }
        }
      });

      // Toggle search box expansion
      function toggleSearch() {
        const searchBox = document.getElementById('search-box');
        const searchInput = document.getElementById('perfume-search');
        searchBox.classList.toggle('expanded');
        if (searchBox.classList.contains('expanded')) {
          searchInput.focus();
        }
      }

      // ========================================
      // Mobile Side Navigation Functions
      // ========================================
      
      function toggleSideNav() {
        const sideNav = document.querySelector('.side-nav');
        const overlay = document.querySelector('.side-nav-overlay');
        const hamburger = document.querySelector('.hamburger-menu');
        
        sideNav.classList.toggle('active');
        overlay.classList.toggle('active');
        hamburger.classList.toggle('active');
        
        // Prevent body scroll when nav is open
        if (sideNav.classList.contains('active')) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
      }
      
      function closeSideNav() {
        const sideNav = document.querySelector('.side-nav');
        const overlay = document.querySelector('.side-nav-overlay');
        const hamburger = document.querySelector('.hamburger-menu');
        
        sideNav.classList.remove('active');
        overlay.classList.remove('active');
        hamburger.classList.remove('active');
        document.body.style.overflow = '';
      }
      
      function toggleLikeSubmenu(element) {
        element.classList.toggle('active');
        const submenu = element.nextElementSibling;
        submenu.classList.toggle('active');
      }
      
      // Update side nav login status
      function updateSideNavLoginStatus() {
        fetch('/pefumeppp/perfdb/get_cart.php', { credentials: 'same-origin' })
          .then(res => res.json())
          .then(data => {
            const loginLink = document.getElementById('side-nav-login');
            const username = document.getElementById('side-nav-username');
            
            if (data.user_logged_in) {
              // User is logged in - show account link
              loginLink.href = '/pefumeppp/customer/dashboard.php';
              username.textContent = data.first_name || 'My Account';
            } else {
              // User is not logged in - show login link
              loginLink.href = 'login.html';
              username.textContent = 'Login';
            }
          })
          .catch(err => console.error('Error updating side nav:', err));
      }
      
      // Update side nav on page load
      document.addEventListener('DOMContentLoaded', updateSideNavLoginStatus);

      // Announcement Bar Carousel
      let currentSlide = 0;
      const slides = document.querySelectorAll('.announcement-slide');
      const totalSlides = slides.length;
      let autoplayInterval;

      function showSlide(index) {
        slides.forEach((slide, i) => {
          slide.classList.remove('active', 'slide-out');
          if (i === currentSlide) {
            slide.classList.add('slide-out');
          }
        });
        
        currentSlide = (index + totalSlides) % totalSlides;
        
        setTimeout(() => {
          slides.forEach(slide => slide.classList.remove('active', 'slide-out'));
          slides[currentSlide].classList.add('active');
        }, 150);
      }

      function nextAnnouncement() {
        showSlide(currentSlide + 1);
        resetAutoplay();
      }

      function prevAnnouncement() {
        showSlide(currentSlide - 1);
        resetAutoplay();
      }

      function startAutoplay() {
        autoplayInterval = setInterval(() => {
          showSlide(currentSlide + 1);
        }, 2000);
      }

      function resetAutoplay() {
        clearInterval(autoplayInterval);
        startAutoplay();
      }

      // Start autoplay on page load
      document.addEventListener('DOMContentLoaded', startAutoplay);


    </script>
