<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Perfume - Unisex</title>
    <link rel="stylesheet" href="selection_styles.css">
    <link rel="icon" type="image/png" href="../images/Untitled_design-removebg-preview.png">
</head>
<body>
    <div class="container">
        <a href="../docs/index.html" class="home-btn" title="Home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </a>
        
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">

        <!-- Search Box -->
        <div class="search-container">
            <div class="search-box">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="perfume-search" placeholder="Search for perfume..." autocomplete="off">
            </div>
            <div id="search-results" class="search-results"></div>
        </div>

        <div class="category-tabs">
            <button class="tab-btn" data-category="man" onclick="window.location.href='man.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                </svg>
                MAN
            </button>
            <button class="tab-btn" data-category="woman" onclick="window.location.href='selection.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                </svg>
                WOMAN
            </button>
            <button class="tab-btn active" data-category="unisex" data-selected="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v6m0 6v6m-6-6h6m6 0h-6"/>
                </svg>
                UNISEX
            </button>
        </div>
        
        <div class="companies-grid">
            <button class="company-btn" data-brand="chanel">
                <span class="company-name">CHANEL</span>
            </button>
            <button class="company-btn" data-brand="dior">
                <span class="company-name">DIOR</span>
            </button>
            <button class="company-btn" data-brand="tomford">
                <span class="company-name">TOM FORD</span>
            </button>
            <button class="company-btn" data-brand="versace">
                <span class="company-name">VERSACE</span>
            </button>
            <button class="company-btn" data-brand="hermes">
                <span class="company-name">HERMÈS</span>
            </button>
            <button class="company-btn" data-brand="gucci">
                <span class="company-name">GUCCI</span>
            </button>
        </div>

        <div class="perfumes-grid">
            <!-- Products will be loaded dynamically from database -->
        </div>
<script src="unisex-script.js"></script>
    <link rel="stylesheet" href="/pefumeppp/assets/cart-widget.css">
    <script src="/pefumeppp/assets/cart-widget.js" defer></script>
    
    <!-- Search functionality -->
    <script>
      const searchInput = document.getElementById('perfume-search');
      const searchResults = document.getElementById('search-results');

      let searchTimeout;
      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        const query = this.value.trim();
        
        if (query.length < 2) {
          searchResults.classList.remove('active');
          searchResults.innerHTML = '';
          return;
        }

        searchTimeout = setTimeout(async () => {
          try {
            const res = await fetch('/pefumeppp/perfdb/search_perfumes.php?q=' + encodeURIComponent(query));
            const data = await res.json();
            
            if (data.success && data.perfumes.length > 0) {
              searchResults.innerHTML = data.perfumes.map(p => `
                <div class="search-item" onclick="window.location.href='/pefumeppp/perfdb/product-details.php?id=${p.id}'">
                  <img src="${p.image || '../images/default-perfume.png'}" alt="${p.name}">
                  <div class="item-info">
                    <div class="item-name">${p.name}</div>
                    <div class="item-price">$${p.price}</div>
                  </div>
                </div>
              `).join('');
              searchResults.classList.add('active');
            } else if (data.suggestion) {
              const s = data.suggestion;
              searchResults.innerHTML = `
                <div class="did-you-mean">
                  <span class="dym-label">Did you mean:</span>
                  <div class="search-item suggestion-item" onclick="window.location.href='/pefumeppp/perfdb/product-details.php?id=${s.id}'">
                    <img src="${s.image || '../images/default-perfume.png'}" alt="${s.name}">
                    <div class="item-info">
                      <div class="item-name">${s.name}</div>
                      <div class="item-price">$${s.price}</div>
                    </div>
                  </div>
                </div>
              `;
              searchResults.classList.add('active');
            } else {
              searchResults.innerHTML = '<div class="no-results">No perfumes found</div>';
              searchResults.classList.add('active');
            }
          } catch (err) {
            console.error('Search error:', err);
          }
        }, 300);
      });

      document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-container')) {
          searchResults.classList.remove('active');
        }
      });
    </script>
</body>
</html>
