<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Perfume - Unisex</title>
    <link rel="stylesheet" href="..//selected/selection_styles.css">
</head>
<body>
    <div class="container">
        <a href="../indexed/index.html" class="home-btn" title="Home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </a>
        
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">
        <div class="category-tabs">
            <button class="tab-btn" data-category="man" onclick="window.location.href='man.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                </svg>
                MAN
            </button>
            <button class="tab-btn" data-category="woman" onclick="window.location.href='selection.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                </svg>
                WOMAN
            </button>
            <button class="tab-btn active" data-category="unisex" data-selected="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v6m0 6v6m-6-6h6m6 0h-6"/>
                </svg>
                UNISEX
            </button>
        </div>
        
        <div class="companies-grid">
            <button class="company-btn" data-brand="chanel">
                <span class="company-name">CHANEL</span>
            </button>
            <button class="company-btn" data-brand="dior">
                <span class="company-name">DIOR</span>
            </button>
            <button class="company-btn" data-brand="tomford">
                <span class="company-name">TOM FORD</span>
            </button>
            <button class="company-btn" data-brand="versace">
                <span class="company-name">VERSACE</span>
            </button>
            <button class="company-btn" data-brand="hermes">
                <span class="company-name">HERMÈS</span>
            </button>
            <button class="company-btn" data-brand="gucci">
                <span class="company-name">GUCCI</span>
            </button>
        </div>

        <div class="perfumes-grid">
            <!-- Products will be loaded dynamically from database -->
        </div>
<div class="golden-stars"></div>
<script>
  const starsContainer = document.querySelector('.golden-stars');

  for (let i = 0; i < 100; i++) {
    const star = document.createElement('span');

    const top = Math.random() * 100; // 0% to 100%
    const left = Math.random() * 100;
    const delay = Math.random() * 5; // 0s to 5s

    star.style.top = `${top}%`;
    star.style.left = `${left}%`;
    star.style.animationDelay = `${delay}s`;

    starsContainer.appendChild(star);
  }
</script>
<script src="unisex-script.js"></script>
</body>
</html>
